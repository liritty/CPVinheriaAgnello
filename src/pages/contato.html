<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/efeitos.css">
    <link rel="icon" href="../assets/imgs/logo uva.png">

    <title>Contato</title>

</head>
<body>

    <header class="site-header">
        <div class="logo-cont">
            <img src="../assets/imgs/logo uva.png" alt="Logo Vinheria Agnello" class="logo-foto">
            <h1>Vinheria Agnello</h1>
        </div>

        <nav id="menu-naveg">
            <a href="../../index.html">Home</a>
            <a href="sobre.html">Sobre</a>
            <a href="galeria.html">Galeria</a>
            <a href="equipe.html">Equipe</a>
            <a href="contato.html">Contato</a>
        </nav>

    </header>

    <section class="contato">
        <form class="formulario" action="" method="post">
            <h1 class="titulo-contato">Fale com a gente</h1>
            <p class="texto-contato">Preencha os campos e entraremos em contato em breve.</p>

            <div class="campo">
                <label for="nome">Nome</label>
                <input class="input" type="text" name="nome" id="nome" placeholder="Digite o seu nome" required>
            </div>

            <div class="campo">
                <label for="numero">Celular</label>
                <input class="input" type="tel" name="numero" id="numero" placeholder="Digite o seu número" required>
            </div>

            <div class="campo">
                <label for="email">E-mail</label>
                <input class="input" type="email" name="email" id="email" placeholder="Digite seu e-mail" required>
            </div>

            <div class="campo">
                <label for="mensagem">Mensagem</label>
                <textarea class="input" name="mensagem" id="mensagem" placeholder="Deixe sua mensagem aqui"></textarea>
            </div>

            <div class="botoes">
                <button class="botao botao-enviar" type="submit">Enviar</button>
                <button class="botao botao-limpar" type="reset">Limpar</button>
            </div>
        </form>
    </section>

    <footer>© 2026 Vinheria Agnello. Todos os direitos reservados.</footer>
</body>
</html>
