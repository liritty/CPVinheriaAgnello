<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" href="../assets/imgs/logo uva.png">

    <title>Contato</title>

</head>
<body>

    <header class="site-header">
        <div class="logo-cont">
        <img src="../assets/imgs/logo uva.png" alt="Logo Vinheria Agnello" class="logo-foto">
            <h1>Vinheria Agnello</h1>
        </div>

        <nav id="menu-naveg">
           <a href="../../index.html">Home</a>
           <a href="sobre.html">Sobre</a>
           <a href="galeria.html">Galeria</a>
           <a href="equipe.html">Equipe</a>
           <a href="contato.html">Contato</a>
        </nav>

    </header>
    
    <section>
        <form action="" method="post">
            <fieldset>
                <!-- O usuário preencherá seus dados pessoais -->
                <legend>Preencha seus dados para cadastro</legend>
                <h3>Dados Pessoais:</h3>
                <label for="nome">Nome:</label>
                <input type="text" name="nome" id="nome" placeholder="Digite o seu nome" required>
                <br><br>
                <label for="sobrenome">Sobrenome:</label>
                <input type="text" name="sobrenome" id="sobrenome" placeholder="Digite o seu sobrenome" required>
                <br><br>
                <label for="email">E-mail:</label>
                <input type="email" name="email" id="email" placeholder="Digite seu e-mail" required>

                <br><br>
                <legend>Escreva sua reclamação aqui</legend>
                <textarea name="reclamacao" id="reclamacao" placeholder="Deixe sua reclamação aqui"></textarea>
                <br>
                <button type="submit">Enviar</button>
                <button type="reset">Limpar</button>
            </fieldset>
        </form>
    </section>

    <footer>

    </footer>
</body>
</html>
